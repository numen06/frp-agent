services:
  frp-agent:
    image: registry.cn-shanghai.aliyuncs.com/numen/frp-agent:latest
    container_name: frp-agent
    restart: always
    ports:
      - "8000:8000"
      - "2222:2222"
      - "23750:23750"
      - "13389:13389"
      # 内置 frps 控制端口及默认 TCP/UDP 代理端口池；开关在服务器管理页面配置。
      - "7000:7000"
      - "6000-6099:6000-6099/tcp"
      - "6000-6099:6000-6099/udp"
    volumes:
      - ./data:/app/data
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}
      - SSH_CREDENTIAL_SECRET=${SSH_CREDENTIAL_SECRET:-}
      - SSH_GATEWAY_ENABLED=true
      - SSH_GATEWAY_PORT=2222
      - DOCKER_GATEWAY_ENABLED=true
      - DOCKER_GATEWAY_PORT=23750
      - DOCKER_GATEWAY_TLS_COMMON_NAME=${DOCKER_GATEWAY_TLS_COMMON_NAME:-localhost}
      - RDP_GATEWAY_ENABLED=${RDP_GATEWAY_ENABLED:-false}
      - RDP_GATEWAY_PORT=13389
      - RDP_GATEWAY_PUBLIC_ADDRESS=${RDP_GATEWAY_PUBLIC_ADDRESS:-}
      - RDP_GATEWAY_TLS_CERT_PATH=/app/data/rdp_gateway_cert.pem
      - RDP_GATEWAY_TLS_KEY_PATH=/app/data/rdp_gateway_key.pem
      - RDP_GATEWAY_TRUSTED_PROXIES=${RDP_GATEWAY_TRUSTED_PROXIES:-}
      - APP_DEBUG=false
      - SYNC_INTERVAL_SECONDS=30
