services:
  frp-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frp-agent
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_DEBUG=false
      - SYNC_INTERVAL_SECONDS=30
